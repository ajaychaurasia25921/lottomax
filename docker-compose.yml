services:
  lottomax:
    build:
      context: .
    environment:
      PORT: 5180
      LOTTOMAX_DATA_DIR: /app/data
      CIAM_PROVIDER: ${CIAM_PROVIDER:-auth0}
      CIAM_ISSUER_URL: ${CIAM_ISSUER_URL:-}
      CIAM_CLIENT_ID: ${CIAM_CLIENT_ID:-}
      CIAM_CLIENT_SECRET: ${CIAM_CLIENT_SECRET:-}
      CIAM_AUDIENCE: ${CIAM_AUDIENCE:-}
      CIAM_REDIRECT_URI: ${CIAM_REDIRECT_URI:-http://localhost:5180/}
      CIAM_SCOPE: ${CIAM_SCOPE:-openid profile email phone}
      CIAM_KYC_CLAIM: ${CIAM_KYC_CLAIM:-https://lottomax.example.com/kyc_status}
      CIAM_ROLE_CLAIM: ${CIAM_ROLE_CLAIM:-https://lottomax.example.com/roles}
      CIAM_DEV_LOGIN_ENABLED: ${CIAM_DEV_LOGIN_ENABLED:-true}
      LOTTOMAX_PAYMENT_PROVIDER: ${LOTTOMAX_PAYMENT_PROVIDER:-razorpay}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      LOTTOMAX_ALLOW_RAZORPAY_TEST_CAPTURE: ${LOTTOMAX_ALLOW_RAZORPAY_TEST_CAPTURE:-true}
      LOTTOMAX_COMPANY_UPI_ID: ${LOTTOMAX_COMPANY_UPI_ID:-lottomax@upi}
      LOTTOMAX_COMPANY_PAYEE_NAME: ${LOTTOMAX_COMPANY_PAYEE_NAME:-LottoMax}
    ports:
      - "5180:5180"
    volumes:
      - lottomax-data:/app/data
    restart: unless-stopped

volumes:
  lottomax-data:
